<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#04070b"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="#22c55e" stroke-width="6" stroke-opacity="0.5"/>
  <!-- Escudo Tático Hexagonal -->
  <polygon points="256,64 416,156 416,340 256,432 96,340 96,156" fill="#09140a" stroke="#39ff14" stroke-width="10" filter="url(#glow)"/>
  <!-- Relâmpago Central Necrovolt -->
  <path d="M280 120 L160 270 L245 270 L220 392 L352 240 L268 240 Z" fill="url(#neon)" filter="url(#glow)"/>
  <!-- Círculo de mira tática -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="14 18" opacity="0.6"/>
</svg>

